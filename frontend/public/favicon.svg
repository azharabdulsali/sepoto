<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#191C21" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#brandGrad)" stroke-width="16" stroke-opacity="0.35"/>

  <!-- Aperture Outer Circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-width="32"/>

  <!-- Aperture Blades -->
  <g stroke="url(#brandGrad)" stroke-width="26" stroke-linecap="round">
    <line x1="296" y1="186" x2="376" y2="330" />
    <line x1="214" y1="186" x2="410" y2="186" />
    <line x1="184" y1="248" x2="280" y2="90" />
    <line x1="214" y1="326" x2="118" y2="162" />
    <line x1="296" y1="326" x2="102" y2="326" />
    <line x1="326" y1="264" x2="230" y2="422" />
  </g>
</svg>