<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- ─── PWA & Mobile App Manifest ───────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#EA580C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sepoto" />

    <!-- ─── Primary SEO Meta Tags ────────────────────────────────────────── -->
    <title>Sepoto — Platform Foto Event & Unduh Digital HD via Nomor BIB</title>
    <meta name="title" content="Sepoto — Platform Foto Event & Unduh Digital HD via Nomor BIB" />
    <meta name="description" content="Temukan foto aksi maraton, sepeda, dan event olahraga Anda secara instan menggunakan pencarian Nomor BIB (Nomor Dada). Pembayaran QRIS praktis & unduh foto kualitas HD tanpa watermark." />
    <meta name="keywords" content="sepoto, foto event, foto maraton, cari nomor bib, fotografi olahraga, foto lari, unduh foto hd, qris foto, photo event marketplace" />
    <meta name="author" content="Sepoto Team" />
    <meta name="robots" content="index, follow" />

    <!-- ─── Open Graph / Facebook / WhatsApp Preview Meta ───────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sepoto.project/" />
    <meta property="og:title" content="Sepoto — Platform Foto Event & Unduh Digital HD via Nomor BIB" />
    <meta property="og:description" content="Cari foto aksi event Anda berdasarkan Nomor BIB. Unduh foto HD kualitas terbaik tanpa watermark." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- ─── Twitter Card Meta ───────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sepoto — Platform Foto Event & Unduh Digital HD" />
    <meta name="twitter:description" content="Cari foto aksi event Anda berdasarkan Nomor BIB. Unduh foto HD kualitas terbaik tanpa watermark." />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- ─── Schema.org Structured Data (JSON-LD) ────────────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Sepoto",
        "alternateName": "sepoto.project",
        "url": "https://sepoto.project/",
        "description": "Platform galeri foto event maraton dan olahraga dengan sistem pencarian Nomor BIB.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://sepoto.project/gallery?bib={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
